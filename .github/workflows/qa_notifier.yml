name: QA Vacancy Notifier

on:
  schedule:
    # 09:00 Portugal (WEST, UTC+1) -> 08:00 UTC
    - cron: "0 8 * * *"
    # 18:00 Portugal (WEST, UTC+1) -> 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore notifier state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: qa-notifier-state-${{ github.run_id }}
          restore-keys: |
            qa-notifier-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_notifier.py --once

      - name: Save notifier state cache
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: qa-notifier-state-${{ github.run_id }}
