name: QA Vacancy Notifier

on:
  schedule:
    # 09:00 local time (UTC+3) -> 06:00 UTC
    - cron: "0 6 * * *"
    # 18:00 local time (UTC+3) -> 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore notifier state cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: qa-notifier-state-${{ github.run_id }}
          restore-keys: |
            qa-notifier-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Missing secret: TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing secret: TELEGRAM_CHAT_ID"
            exit 1
          fi

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_notifier.py --once

      - name: Save notifier state cache
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: qa-notifier-state-${{ github.run_id }}
